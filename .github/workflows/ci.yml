name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Sifat nazorati
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      # E2E testlar uchun (service konteynerlar; faqat CI, haqiqiy sir emas).
      DATABASE_URL: postgresql://lms:lms_ci@localhost:5432/lms?schema=public
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_ci
          POSTGRES_DB: lms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm versiyasi ildizdagi package.json "packageManager" maydonidan olinadi (pnpm@10.34.9).
      - name: pnpm o'rnatish
        uses: pnpm/action-setup@v6

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Turbo kesh
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Bog'liqliklarni o'rnatish
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Takroriy kod (jscpd)
        run: pnpm dup

      - name: Arxitektura qoidalari (dependency-cruiser)
        run: pnpm depcheck

      - name: Testlar
        run: pnpm test

      - name: E2E testlar (PostgreSQL + Redis)
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
